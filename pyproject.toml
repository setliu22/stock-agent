[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent-local"
version = "0.4.1"
description = "Natural-language LSEG deep research, screening, and portfolio agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["portfolio*"]
